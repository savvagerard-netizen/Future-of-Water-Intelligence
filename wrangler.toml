name = "water-intelligence"
main = "src/worker.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Pages configuration
pages_build_caching = true

[env.production]
name = "water-intelligence-prod"
routes = [
  { pattern = "api/*", zone_name = "example.com" }
]

[build]
command = "npm run build"
cwd = "./"
destination = "dist"

[env.preview]
vars = { ENVIRONMENT = "preview" }

[env.production]
vars = { ENVIRONMENT = "production" }

# KV Namespace bindings (for caching/storage)
[[kv_namespaces]]
binding = "CACHE"
id = "cache_namespace_id"
preview_id = "cache_namespace_preview_id"

# D1 Database binding (optional, for structured data)
[[d1_databases]]
binding = "DB"
database_name = "water_intelligence"
database_id = "db_id"
